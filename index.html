/* 給讀屏用的補充文字。用 aria-label 會「取代」整個可讀名稱——
   標了「今年」就把可見的干支與年份蓋掉了，讀屏使用者反而聽不到盤面內容。
   補充語義要用隱藏文字疊加，不是覆蓋。（2026-07-31 第三輪審視指出，屬實） */
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto !important;transition:none !important;animation:none !important}
}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad) 34px}
.screen{display:none}
.screen.on{display:block}
/* ── 題頭 ── */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 12px}
.seal{
  width:40px;height:40px;flex:0 0 auto;background:var(--zhu);color:#f9f1e4;
  display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;
  font-family:var(--serif);font-weight:500;font-size:13px;line-height:1;border-radius:4px;padding:4px;
}
.top h1{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:.14em;margin:0}
.top .sub{font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
/* 排列切換。放在「重新輸入」左邊，同族但更輕：
   只有想換的人才會注意到，不會跟主要動作搶。標籤直接寫目前排法（年→時／時→年），
   看得到狀態也看得到按下去會變什麼。 */
.ord{
  margin-left:auto;font-family:var(--serif);font-size:13px;letter-spacing:.08em;
  border:1px solid var(--line);background:transparent;color:var(--ink-soft);
  border-radius:4px;padding:8px 9px;cursor:pointer;min-height:40px;white-space:nowrap;
}
.ord[aria-pressed="true"]{color:var(--zhu-deep);border-color:var(--zhu-line);background:var(--band)}
.back{
  margin-left:8px;font-family:var(--sans);font-size:14px;letter-spacing:.06em;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:4px;padding:9px 14px;cursor:pointer;min-height:40px;
}
/* ── 卡片與表單 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0 0 12px}
.card h2{font-family:var(--serif);margin:0 0 10px;font-size:16px;font-weight:500;letter-spacing:.14em;color:var(--zhu-deep)}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;color:var(--ink-soft);margin:0 0 5px;letter-spacing:.04em}
/* iOS 的 date／time 原生控件有自帶固有寬度，會忽略 width:100% 而撐破卡片；
   必須同時關掉外觀繼承、把 min-width 歸零、並夾住 max-width。（2026-07-31 iPhone 實測） */
input[type=date],input[type=time],input[type=number],input[type=text],select{
  width:100%;max-width:100%;min-width:0;padding:10px;font-size:16px;
  font-family:var(--sans);color:var(--ink);
  background:#fffdf6;border:1px solid var(--line);border-radius:4px;min-height:46px;
  -webkit-appearance:none;appearance:none;
}
input[type=date],input[type=time]{text-align:left}
select{background-image:none}
input:focus,select:focus{outline:2px solid var(--zhu);outline-offset:-1px}
.seg{display:flex;gap:8px;margin:0 0 12px}
.seg button{
  flex:1;padding:10px 4px;font-family:var(--sans);font-size:15px;color:var(--ink);cursor:pointer;
  background:#fffdf6;border:1px solid var(--line);border-radius:4px;min-height:46px;
}
.seg button.on{background:var(--zhu);border-color:var(--zhu);color:#f9f1e4;font-weight:500}
.btn{
  display:block;width:100%;padding:13px;font-family:var(--serif);font-size:19px;letter-spacing:.3em;
  text-indent:.3em;font-weight:500;cursor:pointer;background:var(--zhu);color:#f9f1e4;
  border:0;border-radius:4px;min-height:52px;
}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);margin:-4px 0 12px}
.chk input{width:20px;height:20px;margin:0}
.hint{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:6px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 反查四柱橫排、干上支下，與命盤同一個視覺結構——
   輸入時的排列跟看到的結果一致，才不用在腦中轉一次。 */
.gzgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.gzcol{display:flex;flex-direction:column;gap:5px}
.gzcol>b{
  font-family:var(--serif);font-size:13px;font-weight:500;color:var(--zhu-deep);
  letter-spacing:.06em;text-align:center;
}
.gzcol select{
  font-family:var(--serif);font-size:22px;text-align:center;text-align-last:center;
  padding:8px 0;min-height:52px;
}
/* ── 命盤 ── */
/* 命盤欄數會變（四柱＋選中的大運／流年／流月），字級同樣用 cqw 量自己，
   欄多就自動縮小，不會擠爆。--cn 由 JS 依實際欄數設定。 */
/* 安全閥：正常情況 grid 的 1fr 欄永不溢出，但若使用者開了系統「文字放大」
   （只放大字、不放大容器），八欄時字會撐出格子而與鄰欄重疊。
   給外層一個 overflow-x:auto，極端情況下改為可捲動而不是疊字。
   我沒有真機可測 OS 層的文字縮放，這是保守的防守，不是實測結論。 */
.chartwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart{
  display:grid;gap:3px;font-size:13px;container-type:inline-size;
  --cn:4;
  --cw:calc((100cqw - 2.4em - var(--cn) * 3px) / var(--cn));
  --gsize:clamp(17px,calc(var(--cw) * .74),34px);
  /* 八欄時 track≈28.9px，扣掉左右內距只剩 ~26.9px；
     藏干一行＝干(csize)＋1px＋十神兩字(small)，三者相加必須 ≤26.9px。 */
  --csize:clamp(9px,calc(var(--cw) * .34),15px);
  /* minmax(0,…) 是關鍵：grid item 預設 min-width:auto，會以 min-content 撐開 track。
     藏干「丙比肩」nowrap 需 ~31px，八欄時 track 只有 28.9px，於是整個 grid 被撐寬而溢出。
     （2026-07-31 實測：340px 溢出 41px、360px 22px、375px 12px、390px 4px） */
  grid-template-columns:minmax(0,2.4em) repeat(var(--cn),minmax(0,1fr));
}
@supports not (container-type:inline-size){
  .chart{--gsize:clamp(17px,7vw,34px);--csize:13px}
}
/* 運限欄與原局分開：淡底＋左側界線，一眼看得出哪些是後天加進來的 */
/* 時運色帶。gap 是 3px，各格底色向外溢 1.5px，左右上下與鄰格相接，
   四欄就讀作一整個區域而不是四個盒子。box-shadow 只繪製、不影響 layout，
   所以八欄溢出的修正完全不受影響。 */
/* 原局／時運分隔畫在 gap 裡，用 pseudo-element——
   原本用 margin-left:7px + border-left:1px，那 8px 是實打實的 layout 寬度，
   八欄時直接把 grid 推爆。分隔線不該增加總寬。 */
.chart .tr.first{position:relative}
/* 分隔線同樣用「各延伸一半」接縫：行距 3px，每段上下各多 1.5px 就連成一條直線。
   眉標那格也畫，線才從「時運」二字一路貫到藏干底部。 */
.chart .tr.first::before,.chart .grp.tr.first::before{
  content:"";position:absolute;left:-2px;top:-1.5px;bottom:-1.5px;
  width:1px;background:var(--line);z-index:2;
}
.chart .grp.tr.first{position:relative}
.chart .hd.tr{color:var(--zhu)}
.chart .grp{
  font-family:var(--sans);font-size:11px;letter-spacing:.34em;text-indent:.34em;
  color:var(--ink-soft);text-align:center;padding:0 0 3px;
}
.chart .grp.tr{background:none;box-shadow:none}
.chart .lab.tr{background:none;box-shadow:none}
.chart>*{min-width:0;box-sizing:border-box}
.chart .lab{
  font-family:var(--serif);font-size:12px;letter-spacing:.14em;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:flex-end;padding-right:3px;
}
.chart .hd{
  font-family:var(--serif);text-align:center;font-size:clamp(11px,calc(var(--cw) * .3),14px);
  letter-spacing:.1em;text-indent:.1em;color:var(--zhu-deep);padding:2px 0 4px;white-space:nowrap;
}
/* A 案（2026-07-31 定稿）：上方命盤干支去框，讓字成為主體。
   產品語法：上方無框＝閱讀區，下方有框的 .chip＝操作區，一眼分得出哪些是看、哪些是按。
   padding 由 5px 補到 6px，補回原本 border 佔的 1px，格高不變。 */
.chart .cell{background:transparent;border:0;border-radius:0;text-align:center;padding:6px 1px}
/* 色帶必須寫在 .chart .cell 去框之後。兩者特異性同為 (0,2,0)，後寫的贏——
   原本色帶在前，被 background:transparent 整個蓋掉，線上才發現時運底完全不見。
   （2026-07-31：這種同分靠順序決勝的坑，靜態檢查看不出來，只有實跑才知道） */
.chart .tr,.chart .sg.tr,.chart .hd.tr{background:var(--band);box-shadow:0 0 0 1.5px var(--band)}
.chart .g{font-family:var(--serif);font-size:var(--gsize);line-height:1.2;font-weight:500}
.chart .sg{text-align:center;font-size:clamp(9.5px,calc(var(--cw) * .28),12px);color:var(--ink-soft);padding:2px 0;white-space:nowrap}
/* 藏干一律頂端對齊。原本用 center，一字（癸正官）會垂直置中、三字（丙庚戊）從頂排，
   各欄第一條就對不上，整排看起來是錯開的。（2026-07-31 使用者回報） */
/* 藏干不加外框：它是次要資訊，跟天干地支同樣的框會搶注意力（規格 §4.3）。
   去框後仍靠置頂對齊與固定行高維持橫向齊平。 */
.chart .cang{
  display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:flex-start;
  padding:6px 1px 2px;min-height:54px;
}
.chart .cang span{line-height:1.5}
.chart .cang.empty{min-height:56px}
.chart .cang span{font-size:clamp(7.5px,calc(var(--cw) * .26),11px);white-space:nowrap;letter-spacing:0}
.chart .cang em{font-family:var(--serif);font-style:normal;font-size:var(--csize);font-weight:500;margin-right:1px}
/* 日主不再用粗紅框；十神列那格改成小標籤，資訊本來就寫在那裡 */
.chart .cell.dm{background:#fffaf2;border-color:var(--line)}
/* 日主標籤貼合內容寬度即可。撐滿整欄會變成 active tab 的樣子，
   反而壓過真正該當焦點的日主天干。（2026-07-31 第二輪審視） */
.chart .sg.dm{padding:0;background:none}
.chart .sg.dm i{
  font-style:normal;display:inline-block;color:#f9f1e4;background:var(--zhu);
  border-radius:3px;line-height:1.35;letter-spacing:.04em;
  /* 內距隨欄寬縮放。固定 6px 在四欄時剛好，八欄時欄寬只剩 31px，
     標籤會佔到 99%，又變回「撐滿整欄」的問題。（2026-07-31 實測） */
  padding:1px clamp(1.5px,calc(var(--cw) * .07),7px);
}
.wood{color:var(--wood)}.fire{color:var(--fire)}.earth{color:var(--earth)}.metal{color:var(--metal)}.water{color:var(--water)}
/* 出生與起運是查核用的補充資訊，不是分析對象——字級與行距都收到最小，
   讓視線停在上方的干支，需要時再低頭看。 */
.born{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-size:10.5px;color:var(--ink-soft);line-height:1.45;
  margin:8px 0 0;padding-top:7px;border-top:1px solid var(--line-soft);
}
.born b{color:var(--ink);font-weight:500}
.brow{display:flex;gap:8px;align-items:baseline}
.brow .bk{flex:0 0 2.4em;color:var(--ink-soft);letter-spacing:.22em}
.brow .bv{color:var(--ink)}
.born .bz{font-family:var(--serif);font-size:15px;letter-spacing:.1em}
/* ── 運限：干上支下、單行排滿、字級依欄數自適應 ──
   用容器查詢單位 cqw 直接量「這一列本身」的寬度，不用 100vw。
   2026-07-31 教訓：原本寫 min(100vw,560px) 去推算，等於假設容器一定佔滿視窗；
   一旦外層被別的規則縮窄，字級就不會跟著縮，字比格子還寬會被切掉。
   量自己永遠比推算別人可靠。
   格寬 = (列寬 − 間隙) / 欄數；干支取格寬 0.62，上下限用 clamp 夾住。 */
.chips{
  display:grid;gap:2px;
  container-type:inline-size;
  --w:calc((100cqw - (var(--n) - 1) * 2px) / var(--n));
  grid-template-columns:repeat(var(--n),1fr);
}
/* 不支援容器查詢的舊瀏覽器（iOS 15 以前）退回視窗寬推算 */
@supports not (container-type:inline-size){
  .chips{--w:calc((min(100vw, 560px) - var(--pad)*2 - 28px - (var(--n) - 1) * 2px) / var(--n));}
}
.chip{
  background:#fffdf6;border:1px solid var(--line);border-radius:4px;
  padding:5px 0 4px;cursor:pointer;color:var(--ink);font-family:var(--serif);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  min-width:0;overflow:hidden;
}
.chip .cg{font-size:clamp(13px,calc(var(--w) * .62),26px);line-height:1.12;font-weight:500;display:block}
.chip .cs{
  font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-size:clamp(8.5px,calc(var(--w) * .27),12px);
  line-height:1.3;color:var(--ink-soft);margin-top:2px;letter-spacing:-.02em;white-space:nowrap;
}
/* 流日約 30 格，硬塞一列每格只剩 10px；改成七欄日曆式，一週一列最好認。 */
.chips.days{--n:7;gap:3px}
.chips.days .chip{padding:4px 0 3px}
/* 紅色語義拆分（2026-07-31）。原本硃紅同時代表火五行、日主、選取、今年、標題，
   而且全部用「整格紅框」這一種載體，所以看到紅框無法判斷是哪一種。
   規則不是「一種顏色只准一個意思」——火五行本來就該是紅字，改不掉也不該改；
   真正要拆的是**載體**：同樣是紅，用字色、用標籤、用角標，就分得開。
     火五行 → 干支「字」的顏色
     日主   → 十神列的小標籤（貼合內容寬度，不佔滿整欄）
     現在   → 右上角小「今」字（不是純圓點，圓點會被當成通知或未讀）
     選取   → 深褐墨外框（中性，不與任何五行色打架）*/
/* 選取＝填淡色塊，不加粗框。與上方命盤「時運欄」的淡底同一套語言：
   選中的運限在上下兩處都用「一塊淡色」表示，是同一個東西的兩個位置。
   粗黑框在一排格子裡會變成最重的元素，反而蓋過真正該看的干支。 */
.chip.on{background:var(--band)}
.chip.on .cs{color:var(--ink)}
/* 「現在」用小「今」字而不是純圓點：圓點在手機語彙裡是通知／未讀／錯誤，
   放在命理格子上會被誤讀。一個字既自解釋又不佔空間。（2026-07-31 第二輪審視） */
.chip.now{position:relative}
.chip.now::after{
  content:"今";position:absolute;top:1px;right:2px;
  font-family:var(--serif);font-size:clamp(7.5px,calc(var(--w) * .24),11px);
  line-height:1;color:var(--zhu);
}
.chip[disabled]{cursor:default}
.step{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line-soft)}
/* 標題不再用「大　運」的全形空格撐字距——那是排版 hack，字距要用 letter-spacing。
   標題靠左、附註靠右，讓每個區塊的資訊位置固定可預期（規格 §5.1）。 */
.step h3{
  font-family:var(--serif);margin:0 0 6px;font-size:14px;font-weight:500;
  letter-spacing:.32em;color:var(--zhu-deep);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
/* 流年排法切換。放在「大運」標題列右端，比 small 註記再輕一階——
   它是排版偏好不是主要操作，不該搶戲。 */
.tgl{
  flex:0 0 auto;font-family:var(--sans);font-size:11px;letter-spacing:.06em;
  border:1px solid var(--line);background:transparent;color:var(--ink-soft);
  border-radius:3px;padding:3px 7px;cursor:pointer;margin-left:8px;
}
.tgl[aria-pressed="true"]{color:var(--zhu-deep);border-color:var(--zhu-line);background:var(--band)}
/* 矩陣：每步大運一欄，欄內直排它那十年。grid-auto-flow:column 正好是
   「填滿一欄再換下一欄」，跟資料的分組順序一致，不用自己算索引。
   欄數與大運同步（--n），字級一樣用 cqw 量自己。 */
.ygrid{
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(10,auto);
  /* 欄距維持 2px 與大運同步（改了就對不齊）；列距歸零，
     讓每欄收成一條緊密的直帶——左右分野靠列距壓縮做出來，不是靠加大欄距。 */
  column-gap:2px;row-gap:0;margin-top:6px;container-type:inline-size;
  --n:9;--w:calc((100cqw - (var(--n) - 1) * 2px) / var(--n));
  grid-template-columns:repeat(var(--n),minmax(0,1fr));
}
/* 矩陣去框，跟上方命盤同一套語言：這裡是通覽用的閱讀區，
   90 個框只會變成網格噪音。秩序靠欄軌與行距維持，不靠線。 */
.ycell{
  background:transparent;border:0;border-radius:2px;
  padding:1px 0;text-align:center;cursor:pointer;color:var(--ink);
  font-family:var(--serif);font-size:clamp(9px,calc(var(--w) * .32),14px);
  line-height:1.08;white-space:nowrap;min-width:0;position:relative;
}
/* 選取用 outline 不用 border——border 會佔 layout，去框後一選就把整欄擠位移。 */
.ycell.on{background:var(--band)}
/* 每欄頭尾的西元年。極小、淡，只作定位用，不搶干支。 */
.ylab{
  font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-size:clamp(7.5px,calc(var(--w) * .2),9.5px);color:var(--ink-soft);
  display:block;text-align:center;line-height:1.2;white-space:nowrap;min-width:0;
}
/* 修飾類不可用 top／bot 這種通用詞——頁首的 .top{display:flex} 會一併命中，
   而 flex 容器不吃 text-align:center，年標就整排靠左了。
   （2026-08-01：盒子中心量起來對齊，墨水卻偏左 16px，就是這個原因） */
.ylab-t{padding-bottom:2px}
.ylab-b{padding-top:2px}
.ycell.now::after{
  content:"今";position:absolute;top:0;right:1px;line-height:1;
  font-size:clamp(6.5px,calc(var(--w) * .2),9px);color:var(--zhu);
}
.step h3 small{
  font-family:var(--sans);font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-weight:400;color:var(--ink-soft);font-size:11.5px;letter-spacing:0;
  text-align:right;flex:1;min-width:0;
}
.err{background:var(--zhu-wash);border:1px solid var(--zhu-line);color:var(--zhu-deep);border-radius:4px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.cands{margin:10px 0 0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.cands button{
  width:100%;text-align:left;padding:11px 12px;font-family:var(--sans);font-size:15px;cursor:pointer;
  background:#fffdf6;border:1px solid var(--line);border-radius:4px;color:var(--ink);
}
footer{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:16px 6px 0;line-height:2}
.lgd{display:inline-flex;align-items:center;gap:4px;margin:0 7px;white-space:nowrap}
.lgd-sel{width:13px;height:13px;border:1px solid var(--line);border-radius:3px;background:var(--band)}
.lgd-now{font-family:var(--serif);color:var(--zhu);font-size:12px;line-height:1}
@media (max-width:340px){ :root{--pad:8px} .top h1{font-size:21px} }
</style>
</head>
<body>

<!-- ═══ 第一頁：輸入 ═══ -->
<div class="screen on" id="scInput"><div class="wrap">
  <div class="top">
    <div class="seal"><span>八</span><span>字</span><span>排</span><span>盤</span></div>
    <div><h1>八字排盤</h1><div class="sub">輸入生日或八字，即可排盤</div></div>
  </div>

  <div class="card">
    <h2>性別</h2>
    <div class="seg" id="segGender">
      <button type="button" data-g="乾" class="on" aria-pressed="true">男（乾造）</button>
      <button type="button" data-g="坤" aria-pressed="false">女（坤造）</button>
    </div>

    <h2>輸入方式</h2>
    <div class="seg" id="segMode">
      <button type="button" data-m="date" class="on" aria-pressed="true">用生日</button>
      <button type="button" data-m="gz" aria-pressed="false">用八字反查</button>
    </div>

    <div id="paneDate">
      <label class="f"><span>快速輸入（西曆數字，例：199101170440 ＝ 1991年1月17日 04:40）</span>
        <input type="text" id="inQuick" inputmode="numeric" autocomplete="off" placeholder="199101170440"></label>
      <div class="hint" id="quickMsg" role="status" aria-live="polite" style="margin:-8px 0 12px"></div>
      <label class="f"><span>出生日期（西曆／陽曆，不是農曆）</span>
        <input type="date" id="inDate" min="1901-01-01" max="2100-12-31"></label>
      <label class="f"><span>出生時間</span>
        <input type="time" id="inTime" value="12:00"></label>
      <label class="f"><span>只知道時辰？用這裡快選</span>
        <select id="inHourBranch"><option value="">（不使用，用上面的時間）</option></select></label>
      <label class="chk"><input type="checkbox" id="inNoTime"><span>完全不知道出生時間</span></label>
      <p class="hint">半夜出生請看清楚：<b>凌晨 0 點多</b>與<b>晚上 11 點多</b>都叫子時，但排出來的日柱不一樣。</p>
    </div>

    <div id="paneGz" hidden>
      <div id="gzInputs"></div>
      <div class="row2">
        <label class="f"><span>搜尋起年</span><input type="number" id="inFrom" value="1930" min="1901" max="2100"></label>
        <label class="f"><span>搜尋迄年</span><input type="number" id="inTo" value="2020" min="1901" max="2100"></label>
      </div>
      <p class="hint">同一組八字每 60 年重複一次，所以要給年份範圍。找到多個時請自行選擇。</p>
    </div>

    <button class="btn" id="btnGo">排盤</button>
    <div id="msg" role="alert" aria-live="assertive"></div>
    <div class="cands" id="cands" aria-live="polite"></div>
  </div>

  <footer>可用年份 1901–2100｜時間視為中國標準時間（東八區）鐘錶時間，不做真太陽時校正。<br>本工具離線運作，不會上傳任何資料。排盤結果僅供參考。</footer>
</div></div>

<!-- ═══ 第二頁：盤面 ═══ -->
<div class="screen" id="scChart"><div class="wrap">
  <div class="top">
    <div><h1 id="chartTitle" tabindex="-1">命盤</h1><div class="sub" id="chartSub"></div></div>
    <button class="ord" id="btnOrder" type="button" aria-pressed="false"
      title="切換四柱排列：年月日時 ↔ 時日月年">年→時</button>
    <button class="back" id="btnBack">重新輸入</button>
  </div>

  <div class="card">
    <div class="chartwrap"><div class="chart" id="chart"></div></div>
    <div class="born" id="born"></div>
  </div>

  <div class="card">
    <div class="step" style="margin:0;padding:0;border:0">
      <h3>大運<small id="dayunNote"></small>
        <button class="tgl" id="btnGrid" type="button" aria-pressed="false"
          title="切換流年排法：只看本運（橫排）↔ 全部大運（直排矩陣）">直排</button></h3>
      <div class="chips" id="dayun" style="--n:9"></div>
      <div class="ygrid" id="ygrid" hidden></div>
    </div>
    <div class="step" id="stepYear">
      <h3>流年<small id="yearNote"></small></h3>
      <div class="chips" id="liunian" style="--n:10"></div>
    </div>
    <div class="step" id="stepMonth">
      <h3>流月<small id="monthNote"></small></h3>
      <div class="chips" id="liuyue" style="--n:12"></div>
    </div>
    <div class="step" id="stepDay">
      <h3>流日<small id="dayNote"></small></h3>
      <div class="chips days" id="liuri" style="--n:7"></div>
    </div>
  </div>

  <footer>點大運看流年，點流年看流月，點流月看流日；選中的會併進上方命盤。<br>
  <span class="lgd"><span class="lgd-sel"></span>目前選取</span>
  <span class="lgd"><span class="lgd-now">今</span>現在（今運／今年／本月／今日）</span></footer>
</div></div>

<script>
(function(){
'use strict';
var Cal=window.ZipingCal;
var GAN='甲乙丙丁戊己庚辛壬癸',ZHI='子丑寅卯辰巳午未申酉戌亥';
var STEMS={甲:{e:'木',yin:false},乙:{e:'木',yin:true},丙:{e:'火',yin:false},丁:{e:'火',yin:true},戊:{e:'土',yin:false},己:{e:'土',yin:true},庚:{e:'金',yin:false},辛:{e:'金',yin:true},壬:{e:'水',yin:false},癸:{e:'水',yin:true}};
var BRANCHES={子:{e:'水',h:['癸']},丑:{e:'土',h:['己','癸','辛']},寅:{e:'木',h:['甲','丙','戊']},卯:{e:'木',h:['乙']},辰:{e:'土',h:['戊','乙','癸']},巳:{e:'火',h:['丙','庚','戊']},午:{e:'火',h:['丁','己']},未:{e:'土',h:['己','丁','乙']},申:{e:'金',h:['庚','壬','戊']},酉:{e:'金',h:['辛']},戌:{e:'土',h:['戊','辛','丁']},亥:{e:'水',h:['壬','甲']}};
var SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'},KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
var WXC={木:'wood',火:'fire',土:'earth',金:'metal',水:'water'};
// 節氣表沿用研究工具的簡體名，對外一律轉繁體。
var TERM_TW={'惊蛰':'驚蟄','芒种':'芒種'};
// 時辰快選按鐘錶順序，且早子與晚子分開：
// 半夜 00:30 出生若誤選 23:00，日柱會整個差一天——一般人最容易踩的坑。
var HOUR_PICKS=[['00:00','子時（凌晨 0 點～0 點 59）'],['01:00','丑時（01:00–02:59）'],
  ['03:00','寅時（03:00–04:59）'],['05:00','卯時（05:00–06:59）'],['07:00','辰時（07:00–08:59）'],
  ['09:00','巳時（09:00–10:59）'],['11:00','午時（11:00–12:59）'],['13:00','未時（13:00–14:59）'],
  ['15:00','申時（15:00–16:59）'],['17:00','酉時（17:00–18:59）'],['19:00','戌時（19:00–20:59）'],
  ['21:00','亥時（21:00–22:59）'],['23:00','子時（晚上 11 點～11 點 59）']];
var NOW_YEAR=new Date().getFullYear();

function el(id){return document.getElementById(id);}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function wxc(c){return WXC[(STEMS[c]||BRANCHES[c]||{}).e]||'';}
function termTW(n){return TERM_TW[n]||n;}
function pad2(n){return (n<10?'0':'')+n;}
function tenGod(day,other){
  var d=STEMS[day],o=STEMS[other];if(!d||!o)return '';
  var s=d.yin===o.yin;
  if(o.e===d.e)return s?'比肩':'劫財';
  if(SHENG[d.e]===o.e)return s?'食神':'傷官';
  if(SHENG[o.e]===d.e)return s?'偏印':'正印';
  if(KE[d.e]===o.e)return s?'偏財':'正財';
  if(KE[o.e]===d.e)return s?'七殺':'正官';
  return '';
}
function jiaziIndex(gz){
  var a=GAN.indexOf(gz[0]),b=ZHI.indexOf(gz[1]);
  if(a<0||b<0||(a%2)!==(b%2))return -1;
  for(var i=a;i<60;i+=10)if(i%12===b)return i;
  return -1;
}
function gzOf(i){i=((i%60)+60)%60;return GAN[i%10]+ZHI[i%12];}
function yearGZ(y){var i=((y-1984)%60+60)%60;return GAN[i%10]+ZHI[i%12];}
// 干上支下：運限格一律兩行，上干下支。
function stackGZ(gz){
  return '<span class="cg '+wxc(gz[0])+'">'+gz[0]+'</span><span class="cg '+wxc(gz[1])+'">'+gz[1]+'</span>';
}

// 四柱排法。港式豎排右起讀，攤成橫排就是 時日月年；預設仍為年月日時。
// 存進 localStorage：偏好這種排法的人每次都要重按太煩，這是本工具唯一寫入的東西。
var ORDER_KEY='paipan_pillar_order',GRID_KEY='paipan_year_grid';
var revOrder=(function(){try{return localStorage.getItem(ORDER_KEY)==='rev';}catch(e){return false;}})();
// 流年矩陣：每步大運一欄，欄內直排它那十年，一眼看完一生。
var yearGrid=(function(){try{return localStorage.getItem(GRID_KEY)==='on';}catch(e){return false;}})();
var gender='乾',mode='date',chart=null,lastDy=null,dayunList=[],selDayun=-1,selYear=null,selMonth=null,selDay=null;

/* ── 輸入初始化 ── */
HOUR_PICKS.forEach(function(x){
  var o=document.createElement('option');o.value=x[0];o.textContent=x[1];
  el('inHourBranch').appendChild(o);
});
// 反查輸入的排列跟著命盤走——兩邊不一致的話，使用者要在腦中轉一次才對得上。
// data-p 記住這一欄是第幾柱（0=年…3=時），讀值時照它取，不靠畫面順序。
function renderGzInputs(){
  var names=['年柱','月柱','日柱','時柱'],idx=[0,1,2,3];
  if(revOrder)idx.reverse();
  var h='<div class="gzgrid">';
  idx.forEach(function(i){
    h+='<div class="gzcol" data-p="'+i+'"><b>'+names[i]+'</b>'
      +'<select data-gz="g'+i+'">'+GAN.split('').map(function(g){return '<option>'+g+'</option>';}).join('')+'</select>'
      +'<select data-gz="z'+i+'">'+ZHI.split('').map(function(z){return '<option>'+z+'</option>';}).join('')+'</select></div>';
  });
  el('gzInputs').innerHTML=h+'</div>';
}
renderGzInputs();
if(!el('inDate').value)el('inDate').value='1990-01-01';

el('segGender').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  gender=b.dataset.g;
  // 視覺 class 與程式狀態必須同步更新，否則讀屏使用者看不到目前選了哪個。
  this.querySelectorAll('button').forEach(function(x){
    var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
});
el('segMode').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  mode=b.dataset.m;
  this.querySelectorAll('button').forEach(function(x){
    var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
  el('paneDate').hidden=mode!=='date';
  el('paneGz').hidden=mode!=='gz';
  el('cands').innerHTML='';el('msg').innerHTML='';
});
// 快速輸入：YYYYMMDDHHMM（12 碼）或 YYYYMMDD（8 碼，時間預設中午）。
// 邊打邊解析並回填正式欄位——讓使用者看得到解析結果，而不是盲打一串數字送出。
function parseQuick(v){
  var d=String(v||'').replace(/\D/g,'');
  if(d.length!==8&&d.length!==12)return null;
  var y=+d.slice(0,4),m=+d.slice(4,6),dd=+d.slice(6,8);
  var hh=d.length===12?+d.slice(8,10):12,mi=d.length===12?+d.slice(10,12):0;
  if(y<1901||y>2100||m<1||m>12||dd<1||dd>31||hh>23||mi>59)return null;
  if(dd>new Date(y,m,0).getDate())return null;   // 擋 2月30日 這種
  return {y:y,m:m,d:dd,h:hh,mi:mi,hasTime:d.length===12};
}
el('inQuick').addEventListener('input',function(){
  var msg=el('quickMsg'),raw=this.value.replace(/\D/g,'');
  if(!raw){msg.textContent='';return;}
  var q=parseQuick(raw);
  if(!q){
    msg.textContent=raw.length<8?'再輸入 '+(8-raw.length)+' 碼（共 8 碼日期，或 12 碼含時間）':'這串數字不是有效的日期時間，請檢查。';
    msg.style.color='var(--zhu-deep)';
    return;
  }
  el('inDate').value=q.y+'-'+pad2(q.m)+'-'+pad2(q.d);
  el('inTime').value=pad2(q.h)+':'+pad2(q.mi);
  el('inNoTime').checked=false;el('inTime').disabled=false;el('inHourBranch').disabled=false;
  msg.style.color='var(--ink-soft)';
  msg.textContent='＝ '+q.y+' 年 '+q.m+' 月 '+q.d+' 日 '+pad2(q.h)+':'+pad2(q.mi)
    +(q.hasTime?'':'（未填時間，暫用中午 12:00）');
});
el('inHourBranch').addEventListener('change',function(){
  if(!this.value)return;
  el('inTime').value=this.value;
  el('inNoTime').checked=false;el('inTime').disabled=false;
});
el('inNoTime').addEventListener('change',function(){
  el('inTime').disabled=this.checked;el('inHourBranch').disabled=this.checked;
});
el('btnBack').addEventListener('click',function(){showScreen('scInput');});
function syncOrderBtn(){
  var b=el('btnOrder');
  b.textContent=revOrder?'時→年':'年→時';
  b.setAttribute('aria-pressed',revOrder);
  b.title='目前：'+(revOrder?'時日月年':'年月日時')+'　按此切換為'+(revOrder?'年月日時':'時日月年');
}
el('btnOrder').addEventListener('click',function(){
  revOrder=!revOrder;
  try{localStorage.setItem(ORDER_KEY,revOrder?'rev':'std');}catch(e){}
  syncOrderBtn();renderGzInputs();
  if(chart)redrawAll();
});
syncOrderBtn();
function showScreen(id){
  ['scInput','scChart'].forEach(function(x){el(x).classList.toggle('on',x===id);});
  window.scrollTo(0,0);
  // 切頁後焦點若留在已隱藏的按鈕上，鍵盤使用者會迷路、讀屏也不會宣布換頁。
  // 把焦點交給新頁的起點。（2026-07-31 第三輪審視）
  var focus=id==='scChart'?el('chartTitle'):el('inQuick');
  if(focus&&focus.focus)try{focus.focus({preventScroll:true});}catch(e){focus.focus();}
}

/* ── 起運與大運 ── */
function calcQiYun(b,fwd){
  var jie=fwd?Cal.nextJie(b.y,b.m,b.d,b.h,b.mi,0):Cal.prevJie(b.y,b.m,b.d,b.h,b.mi,0);
  if(!jie)return null;
  var mins=Cal.minutesBetween({y:b.y,m:b.m,d:b.d,h:b.h,mi:b.mi,s:0},jie);
  var td=mins/1440,tm=td*4,w=Math.floor(tm),e=Math.round((tm-w)*30);
  if(e>=30){w+=1;e-=30;}
  // 一併回傳「距節氣多遠」。起運＝三日折一歲，這個距離就是算料；
  // 只寫「距立春」而不寫距多少，等於給了單位沒給數字，看的人無從核對。
  return {jieName:jie.name,years:Math.floor(w/12),months:w%12,days:e,exact:td/3,
          gapDays:Math.floor(mins/1440),gapHours:Math.floor((mins%1440)/60),
          jieDate:pad2(jie.m)+'.'+pad2(jie.d)};
}
function buildDayun(c){
  var yangYear=STEMS[c.p.year[0]].yin===false;
  var fwd=(gender==='乾')===yangYear;            // 陽年男、陰年女順行
  var qi=calcQiYun(c.b,fwd);
  if(!qi)return {qi:null,fwd:fwd,list:[]};
  var mi=jiaziIndex(c.p.month),list=[],baseAge=qi.exact;
  for(var n=1;n<=9;n++){
    var from=c.b.y+Math.round(baseAge)+(n-1)*10;
    list.push({gz:gzOf(mi+(fwd?n:-n)),age:qi.years+(n-1)*10,from:from,to:from+9});
  }
  return {qi:qi,fwd:fwd,list:list};
}
/* ── 流月：立春到隔年立春，十二節為界 ── */
function buildLiuYue(year){
  var out=[],jie=Cal.nextJie(year,1,20,0,0,0),g=0;
  while(jie&&jie.jieIdx!==0&&g++<20)jie=Cal.nextJie(jie.y,jie.m,jie.d,jie.h,jie.mi,jie.s);
  if(!jie)return out;
  var start=[2,4,6,8,0][GAN.indexOf(yearGZ(year)[0])%5];   // 五虎遁
  for(var i=0;i<12&&jie;i++){
    out.push({gz:GAN[(start+jie.jieIdx)%10]+ZHI[(jie.jieIdx+2)%12],
              term:termTW(jie.name),y:jie.y,m:jie.m,d:jie.d});
    jie=Cal.nextJie(jie.y,jie.m,jie.d,jie.h,jie.mi,jie.s);
  }
  return out;
}

/* 流日：該流月自本節當日起，到下一個節的前一日為止（約 29–32 天）。
   日柱直接問曆法引擎，不自己算——引擎的 JDN 純算術是全庫共用的真相來源。 */
function buildLiuRi(year,mIdx){
  var ms=buildLiuYue(year);if(!ms[mIdx])return [];
  var a=ms[mIdx],b=ms[mIdx+1];
  var end;
  if(b){end=new Date(Date.UTC(b.y,b.m-1,b.d));}
  else{var nx=buildLiuYue(year+1);end=nx[0]?new Date(Date.UTC(nx[0].y,nx[0].m-1,nx[0].d)):null;}
  if(!end)return [];
  var out=[],cur=new Date(Date.UTC(a.y,a.m-1,a.d)),guard=0;
  while(cur<end&&guard++<40){
    var y=cur.getUTCFullYear(),m=cur.getUTCMonth()+1,d=cur.getUTCDate();
    out.push({gz:Cal.pillars(y,m,d,12,0,0).day,y:y,m:m,d:d});
    cur=new Date(cur.getTime()+86400000);
  }
  return out;
}
/* ── 渲染 ── */
// 命盤＝四柱＋（選中的）大運／流年／流月。把運限直接併進同一張表，
// 才能上下對齊看生克刑沖；分開兩塊看，眼睛要來回跳，等於沒有視覺化。
function renderChart(c){
  var cols=[['年柱',c.p.year,0],['月柱',c.p.month,0],['日柱',c.p.day,0],['時柱',c.p.time,0]];
  // 只倒原局四柱；大運／流年等仍接在右側自成一組，分區與分隔線邏輯不變。
  if(revOrder)cols.reverse();
  var tr=currentTransit();
  if(tr.dayun)cols.push(['大運',tr.dayun,1]);
  if(tr.liunian)cols.push(['流年',tr.liunian,1]);
  if(tr.liuyue)cols.push(['流月',tr.liuyue,1]);
  if(tr.liuri)cols.push(['流日',tr.liuri,1]);
  var dg=c.p.day[0],firstTr=4;
  function trc(x,i){return x[2]?' tr'+(i===firstTr?' first':''):'';}
  // 分區眉標：讓「固定的原局」與「流動的時運」一眼分得開，比加粗分隔線精緻。
  var nTr=cols.length-4;
  var h='<div class="lab"></div><div class="grp" style="grid-column:span 4">原局</div>';
  if(nTr>0)h+='<div class="grp tr first" style="grid-column:span '+nTr+'">時運</div>';
  h+='<div class="lab"></div>';
  cols.forEach(function(x,i){h+='<div class="hd'+trc(x,i)+'">'+x[0]+'</div>';});
  h+='<div class="lab">十神</div>';
  cols.forEach(function(x,i){
    var isDm=x[0]==='日柱';
    h+='<div class="sg'+(isDm?' dm':'')+trc(x,i)+'">'+(isDm?'<i>日主</i>':tenGod(dg,x[1][0]))+'</div>';
  });
  h+='<div class="lab">天干</div>';
  cols.forEach(function(x,i){h+='<div class="cell'+(x[0]==='日柱'?' dm':'')+trc(x,i)+'"><div class="g '+wxc(x[1][0])+'">'+x[1][0]+'</div></div>';});
  h+='<div class="lab">地支</div>';
  cols.forEach(function(x,i){h+='<div class="cell'+trc(x,i)+'"><div class="g '+wxc(x[1][1])+'">'+x[1][1]+'</div></div>';});
  h+='<div class="lab">藏干</div>';
  cols.forEach(function(x,i){
    var hid=(BRANCHES[x[1][1]]||{}).h||[];
    h+='<div class="cang'+trc(x,i)+'">'+hid.map(function(g){
      return '<span><em class="'+wxc(g)+'">'+g+'</em>'+tenGod(dg,g)+'</span>';}).join('')+'</div>';
  });
  var box=el('chart');
  box.style.setProperty('--cn',cols.length);
  box.innerHTML=h;
}
// 目前選中的大運／流年／流月干支；沒選就是 null。
function currentTransit(){
  var out={dayun:null,liunian:null,liuyue:null,liuri:null};
  if(selDayun>=0&&dayunList[selDayun])out.dayun=dayunList[selDayun].gz;
  if(selYear!=null){
    out.liunian=yearGZ(selYear);
    if(selMonth!=null){
      var ms=buildLiuYue(selYear);
      if(ms[selMonth])out.liuyue=ms[selMonth].gz;
      if(selDay!=null){
        var ds=buildLiuRi(selYear,selMonth);
        if(ds[selDay])out.liuri=ds[selDay].gz;
      }
    }
  }
  return out;
}
function renderBorn(c,dy){
  // label／value 兩欄對齊，label 淡、value 深；數字等寬。比整句散文好掃（規格 §4.4）。
  var t=c.noTime?'時間不詳（時柱與起運僅供參考）':pad2(c.b.h)+':'+pad2(c.b.mi);
  var row=function(k,v){return '<div class="brow"><span class="bk">'+k+'</span><span class="bv">'+v+'</span></div>';};
  var s=row('出生',c.b.y+'.'+pad2(c.b.m)+'.'+pad2(c.b.d)+'　'+t);
  if(dy&&dy.qi){
    s+=row('起運',dy.qi.years+' 年 '+dy.qi.months+' 個月 '+dy.qi.days+' 天後　· 　'
      +(dy.fwd?'順行':'逆行'));
    // 續行的 label 留空即可（.bk 有固定寬度會撐出對齊），不要用全形空格假裝。
    s+=row('',['距'+termTW(dy.qi.jieName)+'（'+dy.qi.jieDate+'）',
               dy.qi.gapDays+' 天 '+dy.qi.gapHours+' 時'].join('　'));
  }
  el('born').innerHTML=s;
  el('chartTitle').textContent=gender==='乾'?'乾造':'坤造';
  var bz=[c.p.year,c.p.month,c.p.day,c.p.time];
  if(revOrder)bz.reverse();
  el('chartSub').innerHTML='<span class="bz">'+bz.join(' ')+'</span>';
}
function renderDayun(){
  el('dayun').innerHTML=dayunList.map(function(d,i){
    var now=NOW_YEAR>=d.from&&NOW_YEAR<=d.to;
    return '<button type="button" class="chip'+(i===selDayun?' on':'')+(now?' now':'')+'" data-dy="'+i+'"'
      +' aria-pressed="'+(i===selDayun)+'"'+(now?' title="目前大運"':'')+'>'
      +stackGZ(d.gz)+'<span class="cs">'+d.age+'歲</span>'
      +(now?'<span class="sr-only">目前大運</span>':'')+'</button>';
  }).join('');
  el('dayunNote').textContent=dayunList.length?(dayunList[0].age+' 歲起運'):'';
}
// 流年矩陣。九步大運各一欄，欄內十年直排；grid-auto-flow:column 會照
// 「填滿一欄再換下一欄」排，正好對應資料的分組順序，不必自己算索引。
function renderYearGrid(){
  var box=el('ygrid');
  box.hidden=!yearGrid;
  el('stepYear').hidden=yearGrid;      // 矩陣已含全部流年，橫排那條就多餘了
  if(!yearGrid||!dayunList.length){box.innerHTML='';return;}
  box.style.setProperty('--n',dayunList.length);
  // 12 列＝起年＋十個流年＋止年。頭尾標年份，中間不標，
  // 這樣不用數格子也知道落在哪一年（同紙本命書的「始於／止於」）。
  box.style.gridTemplateRows='repeat(12,auto)';
  var h='';
  dayunList.forEach(function(d,di){
    h+='<div class="ylab ylab-t">'+d.from+'</div>';
    for(var i=0;i<10;i++){
      var y=d.from+i,gz=yearGZ(y),on=(di===selDayun&&y===selYear),now=(y===NOW_YEAR);
      h+='<button type="button" class="ycell'+(on?' on':'')+(now?' now':'')+'"'
        +' data-yg="'+di+'_'+y+'" aria-pressed="'+on+'"'+(now?' title="今年"':'')+'>'
        +'<span class="'+wxc(gz[0])+'">'+gz[0]+'</span><span class="'+wxc(gz[1])+'">'+gz[1]+'</span>'
        +(now?'<span class="sr-only">今年</span>':'')+'</button>';
    }
    h+='<div class="ylab ylab-b">'+d.to+'</div>';
  });
  box.innerHTML=h;
}
el('ygrid').addEventListener('click',function(e){
  var b=e.target.closest('[data-yg]');if(!b)return;
  var p=b.dataset.yg.split('_'),di=+p[0],y=+p[1];
  // 同一格再點取消回到純原局；否則選中該大運與該流年。
  if(di===selDayun&&y===selYear){selYear=null;selMonth=null;selDay=null;}
  else{selDayun=di;selYear=y;selMonth=null;selDay=null;}
  redrawAll();
});
function syncGridBtn(){
  var b=el('btnGrid');
  b.textContent=yearGrid?'橫排':'直排';
  b.setAttribute('aria-pressed',yearGrid);
  b.title='目前：'+(yearGrid?'全部大運的流年直排矩陣':'只看本運流年橫排')
    +'　按此切換為'+(yearGrid?'只看本運（橫排）':'全部大運（直排）');
}
el('btnGrid').addEventListener('click',function(){
  yearGrid=!yearGrid;
  try{localStorage.setItem(GRID_KEY,yearGrid?'on':'off');}catch(e){}
  syncGridBtn();
  if(chart)redrawAll();else{el('ygrid').hidden=!yearGrid;el('stepYear').hidden=yearGrid;}
});
syncGridBtn();
function renderLiunian(){
  if(selDayun<0){el('liunian').innerHTML='';return;}
  var d=dayunList[selDayun],out='';
  for(var i=0;i<10;i++){
    var y=d.from+i;
    out+='<button type="button" class="chip'+(y===selYear?' on':'')+(y===NOW_YEAR?' now':'')+'" data-ln="'+y+'"'
      +' aria-pressed="'+(y===selYear)+'"'+(y===NOW_YEAR?' title="今年"':'')+'>'
      +stackGZ(yearGZ(y))+'<span class="cs">'+String(y).slice(2)+'</span>'
      +(y===NOW_YEAR?'<span class="sr-only">今年</span>':'')+'</button>';
  }
  el('liunian').innerHTML=out;
  el('yearNote').textContent=d.gz+'運　'+d.from+'–'+d.to;
}
function renderLiuyue(){
  if(selYear==null){el('liuyue').innerHTML='';el('monthNote').textContent='';return;}
  var ms=buildLiuYue(selYear),now=Date.now();
  // 四層運限都要標「現在」：大運、流年、流日原本都有，只有流月漏了，四層裡缺一層最刺眼。
  // 命理的月以節氣為界，所以「本月」＝今天落在該節到下一節之間，不是日曆的月份。
  var nowIdx=-1;
  for(var k=0;k<ms.length;k++){
    var a=Date.UTC(ms[k].y,ms[k].m-1,ms[k].d);
    var b=ms[k+1]?Date.UTC(ms[k+1].y,ms[k+1].m-1,ms[k+1].d):a+32*86400000;
    if(now>=a&&now<b){nowIdx=k;break;}
  }
  el('liuyue').innerHTML=ms.map(function(m,i){
    return '<button type="button" class="chip'+(i===selMonth?' on':'')+(i===nowIdx?' now':'')+'" data-ly="'+i+'"'
      +' aria-pressed="'+(i===selMonth)+'"'+(i===nowIdx?' title="本月"':'')+'>'
      +stackGZ(m.gz)+'<span class="cs">'+m.m+'/'+m.d+'</span>'
      +(i===nowIdx?'<span class="sr-only">本月</span>':'')+'</button>';
  }).join('');
  el('monthNote').textContent=selYear+' 年 '+yearGZ(selYear)+'　自立春起算';
}
// 副標八字也在 renderBorn 裡，切換排法時必須一起重繪——
// 否則命盤倒了、上面那行八字還是舊順序，兩處互相打臉。
function redrawAll(){
  renderChart(chart);renderBorn(chart,lastDy);
  renderDayun();renderYearGrid();renderLiunian();renderLiuyue();renderLiuri();
}
function renderLiuri(){
  var box=el('liuri'),note=el('dayNote');
  if(selYear==null||selMonth==null){box.innerHTML='';note.textContent='';el('stepDay').hidden=true;return;}
  el('stepDay').hidden=false;
  var ds=buildLiuRi(selYear,selMonth),today=new Date();
  var ty=today.getFullYear(),tm=today.getMonth()+1,td=today.getDate();
  box.innerHTML=ds.map(function(x,i){
    var isToday=(x.y===ty&&x.m===tm&&x.d===td);
    return '<button type="button" class="chip'+(i===selDay?' on':'')+(isToday?' now':'')+'" data-lr="'+i+'"'
      +' aria-pressed="'+(i===selDay)+'"'+(isToday?' title="今日"':'')+'>'
      +stackGZ(x.gz)+'<span class="cs">'+x.m+'/'+x.d+'</span>'
      +(isToday?'<span class="sr-only">今日</span>':'')+'</button>';
  }).join('');
  note.textContent=ds.length?(ds[0].m+'/'+ds[0].d+'–'+ds[ds.length-1].m+'/'+ds[ds.length-1].d+'　共 '+ds.length+' 天'):'';
}
el('liuri').addEventListener('click',function(e){
  var b=e.target.closest('[data-lr]');if(!b)return;
  var i=+b.dataset.lr;
  selDay=(i===selDay)?null:i;
  redrawAll();
});
el('dayun').addEventListener('click',function(e){
  var b=e.target.closest('[data-dy]');if(!b)return;
  var i=+b.dataset.dy;
  // 再點一次取消，讓使用者可以只看原局。
  if(i===selDayun){selDayun=-1;selYear=null;selMonth=null;selDay=null;redrawAll();return;}
  selDayun=i;
  var d=dayunList[selDayun];
  // 切換大運時，若今年落在該運內就停在今年，否則停在該運頭一年。
  selYear=(NOW_YEAR>=d.from&&NOW_YEAR<=d.to)?NOW_YEAR:d.from;
  selMonth=null;selDay=null;
  redrawAll();
});
el('liunian').addEventListener('click',function(e){
  var b=e.target.closest('[data-ln]');if(!b)return;
  var y=+b.dataset.ln;
  if(y===selYear){selMonth=null;}else{selYear=y;selMonth=null;}
  selDay=null;
  redrawAll();
});
el('liuyue').addEventListener('click',function(e){
  var b=e.target.closest('[data-ly]');if(!b)return;
  var i=+b.dataset.ly;
  selMonth=(i===selMonth)?null:i;selDay=null;
  redrawAll();
});

/* ── 排盤 ── */
function showErr(t){el('msg').innerHTML=t?'<div class="err">'+esc(t)+'</div>':'';}
function branchIndexOfHour(h){return h===23?0:Math.floor((h+1)/2);}
// 排完盤自動定位到今年：找出今年所在的大運，沒有就取最接近的一步。
function focusToday(){
  if(!dayunList.length){selDayun=-1;selYear=null;return;}
  var idx=-1;
  for(var i=0;i<dayunList.length;i++)
    if(NOW_YEAR>=dayunList[i].from&&NOW_YEAR<=dayunList[i].to){idx=i;break;}
  if(idx<0)idx=NOW_YEAR<dayunList[0].from?0:dayunList.length-1;
  selDayun=idx;
  var d=dayunList[idx];
  selYear=(NOW_YEAR>=d.from&&NOW_YEAR<=d.to)?NOW_YEAR:d.from;
}
function castFromDate(y,m,d,hh,mi,noTime){
  var p=Cal.pillars(y,m,d,hh,mi,0);
  chart={p:{year:p.year,month:p.month,day:p.day,time:p.time},
         b:{y:y,m:m,d:d,h:hh,mi:mi},noTime:!!noTime};
  var dy=buildDayun(chart);
  dayunList=dy.list;selMonth=null;selDay=null;lastDy=dy;
  focusToday();
  redrawAll();
  showScreen('scChart');
}

el('btnGo').addEventListener('click',function(){
  showErr('');el('cands').innerHTML='';
  try{
    if(mode==='date'){
      var v=el('inDate').value;
      if(!v){showErr('請先填出生日期。');return;}
      var q=v.split('-'),y=+q[0],m=+q[1],d=+q[2];
      if(!(y>=1901&&y<=2100)){showErr('目前只支援 1901 年到 2100 年出生的人。');return;}
      var noTime=el('inNoTime').checked,hh=12,mi=0;
      if(!noTime){var tp=(el('inTime').value||'12:00').split(':');hh=+tp[0];mi=+tp[1]||0;}
      castFromDate(y,m,d,hh,mi,noTime);
    }else{
      // 依 data-gz 取值，不依畫面順序——倒排後 DOM 順序會變，靠位置取會錯柱。
      var sels=el('gzInputs').querySelectorAll('select'),byKey={},gz=[];
      for(var k=0;k<sels.length;k++)byKey[sels[k].getAttribute('data-gz')]=sels[k].value;
      for(var i=0;i<4;i++)gz.push((byKey['g'+i]||'')+(byKey['z'+i]||''));
      for(var j=0;j<4;j++)if(jiaziIndex(gz[j])<0){
        showErr('第 '+(j+1)+' 柱「'+gz[j]+'」不是合法干支（天干與地支的陰陽要相同，例如甲子可以、甲丑不行）。');return;
      }
      var from=+el('inFrom').value,to=+el('inTo').value;
      if(!(from>=1901&&to<=2100&&from<=to)){showErr('年份範圍請填在 1901 到 2100 之間，且起年不大於迄年。');return;}
      var list=Cal.reverse({year:gz[0],month:gz[1],day:gz[2],time:gz[3]},from,to)||[];
      if(!list.length){showErr('在 '+from+'–'+to+' 年之間找不到這組八字。請確認四柱抄對了，或把年份範圍放寬。');return;}
      if(list.length===1){castFromDate(list[0].y,list[0].m,list[0].d,list[0].h,0,false);return;}
      el('cands').innerHTML='<p class="hint" style="margin:0 0 4px">找到 '+list.length+' 個結果，請點正確的一個：</p>'
        +list.map(function(x,k){return '<button type="button" data-c="'+k+'">'+x.y+' 年 '+x.m+' 月 '+x.d+' 日　'
          +pad2(x.h)+':00（'+ZHI[branchIndexOfHour(x.h)]+'時）</button>';}).join('');
      el('cands').onclick=function(e){
        var b=e.target.closest('[data-c]');if(!b)return;
        var x=list[+b.dataset.c];castFromDate(x.y,x.m,x.d,x.h,0,false);
      };
    }
  }catch(err){showErr('排盤時發生問題：'+(err&&err.message?err.message:err));}
});
})();
</script>
